name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    name: ビルドとスモークテスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: docker-compose.yml の検証
        run: docker compose config --quiet

      - name: イメージのビルド
        run: docker compose build

      # GitHub のランナーには GPU が無いので、GPU のテストはスキップされる
      - name: スモークテスト
        run: tests/smoke-test.sh
