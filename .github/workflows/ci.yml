name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  smoke-test:
    name: ビルドとスモークテスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: docker-compose.yml の検証
        run: docker compose config --quiet

      - name: イメージのビルド
        id: build
        run: docker compose build

      # GitHub のランナーには GPU が無いので、GPU のテストはスキップされる
      - name: スモークテスト
        run: tests/smoke-test.sh

      # 公式の trivy のイメージで、脆弱性・設定の問題・秘密情報・ライセンスを調べる。
      # 失敗させるのは、秘密情報と、修正版がある CRITICAL の脆弱性だけ。
      # スモークテストが失敗しても、ビルドできていればスキャンの結果は出す
      - name: イメージのスキャン（trivy）
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tests/image-scan.sh
