name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    name: ビルドとスモークテスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: docker-compose.yml の検証
        run: docker compose config --quiet

      - name: イメージのビルド
        run: docker compose build

      # GitHub のランナーには GPU が無いので、GPU のテストはスキップされる
      - name: スモークテスト
        run: tests/smoke-test.sh
